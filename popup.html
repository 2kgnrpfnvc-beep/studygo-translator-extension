<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudyGo Practice Helper</title>
  <style>
    body { width: 320px; margin: 0; padding: 16px; font: 14px system-ui, sans-serif; color: #202124; }
    h1 { font-size: 17px; margin: 0 0 8px; }
    p { margin: 8px 0; line-height: 1.4; }
    textarea { box-sizing: border-box; width: 100%; min-height: 130px; resize: vertical; }
    button { margin-top: 10px; padding: 8px 12px; cursor: pointer; }
    #status { min-height: 18px; color: #555; }
    .note { font-size: 12px; color: #666; }
  </style>
</head>
<body>
  <h1>StudyGo Practice Helper</h1>
  <p>Paste your word list below. Use one pair per line, for example:</p>
  <pre>house = huis
book = boek</pre>
  <textarea id="wordlist" placeholder="word = translation"></textarea>
  <button id="save">Save word list</button>
  <button id="show">Show translation on this page</button>
  <p id="status" role="status"></p>
  <p class="note">This helper displays translations for studying and never fills in test answer boxes.</p>
  <script src="popup.js"></script>
</body>
</html>
